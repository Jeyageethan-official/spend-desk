<!--
  SpendDesk · Confirm sign-up email template (Supabase)

  Install in Supabase Dashboard → Authentication → Email Templates
  → Confirm signup. Paste the HTML below this comment and save.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirm your SpendDesk account</title>
</head>
<body style="margin:0;padding:0;background:#f0f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f0f4f5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px -18px rgba(3,20,14,0.35);">
          <tr>
            <td style="background:linear-gradient(160deg,#0f8a68 0%,#0a4a37 60%,#051711 100%);padding:28px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding-right:10px;"><div style="width:34px;height:34px;border-radius:9px;background:#10b77f;color:#ffffff;font-size:18px;font-weight:800;line-height:34px;text-align:center;">S</div></td>
                  <td style="font-size:19px;font-weight:800;letter-spacing:-0.02em;color:#ffffff;">SpendDesk</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 16px;font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#10b77f;">Welcome to SpendDesk</p>
              <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25;letter-spacing:-0.02em;color:#0f172a;">Confirm your email address</h1>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#475569;">Thanks for creating a SpendDesk account. Confirm your email to securely open your wallet.</p>
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px;"><tr><td style="background:#10b77f;border-radius:12px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;">Confirm my account</a></td></tr></table>
              <p style="margin:0;font-size:13px;line-height:1.6;color:#94a3b8;">If you did not create a SpendDesk account, you can safely ignore this email.</p>
            </td>
          </tr>
          <tr><td style="padding:20px 32px 28px;border-top:1px solid #eef2f5;"><p style="margin:0;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#94a3b8;">Clean · Simple · Powerful · For a brighter you</p></td></tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
